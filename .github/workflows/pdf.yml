name: PDF Guide

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            fonts-dejavu-core \
            pandoc \
            poppler-utils \
            qpdf \
            tesseract-ocr \
            tesseract-ocr-eng \
            texlive-latex-extra \
            texlive-xetex

      - name: Build twice and validate PDF
        run: make check-pdf

      - name: Record build toolchain
        shell: bash
        run: |
          {
            echo "UTC HPC Guide PDF build traceability record"
            echo
            echo "[run]"
            echo "commit=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "[runner]"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "ImageOS=${ImageOS:-unavailable}"
            echo "ImageVersion=${ImageVersion:-unavailable}"
            echo
            echo "[os-release]"
            cat /etc/os-release
            echo
            echo "[command-versions]"
            python3 --version
            pandoc --version
            xelatex --version
            qpdf --version
            pdfinfo -v 2>&1
            pdffonts -v 2>&1
            pdftotext -v 2>&1
            pdftoppm -v 2>&1
            tesseract --version
            tesseract --list-langs
            fc-match --version
            echo
            echo "[package-versions]"
            dpkg-query -W -f='${binary:Package}\t${Version}\n' \
              fonts-dejavu-core \
              pandoc \
              poppler-utils \
              qpdf \
              tesseract-ocr \
              tesseract-ocr-eng \
              texlive-latex-extra \
              texlive-xetex
            echo
            echo "[font-resolution]"
            printf "requested=DejaVu Serif\t"
            fc-match -f='family=%{family}\tfile=%{file}\n' "DejaVu Serif"
            printf "requested=DejaVu Sans\t"
            fc-match -f='family=%{family}\tfile=%{file}\n' "DejaVu Sans"
            printf "requested=DejaVu Sans Mono\t"
            fc-match -f='family=%{family}\tfile=%{file}\n' "DejaVu Sans Mono"
            echo
            echo "[pdf-sha256]"
            sha256sum dist/UTC_HPC_Guide_v1.2.1-rc.1.pdf
          } > dist/build-toolchain.txt

      - name: Upload PDF review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: utc-hpc-guide-pdf-${{ github.sha }}
          path: |
            dist/UTC_HPC_Guide_v1.2.1-rc.1.pdf
            dist/build-toolchain.txt
          if-no-files-found: error
          retention-days: 14
