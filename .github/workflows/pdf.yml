name: PDF Guide

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test toolchain-record failure paths
        run: python3 -m unittest tests.test_write_pdf_toolchain_record

      - name: Install exact host PDF QA packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t qa_packages < <(
            python3 -c '
          import json
          from pathlib import Path

          lock = json.loads(
              Path("pdf/toolchain.lock.json").read_text(encoding="utf-8")
          )
          for package, version in lock["ubuntu_24_04_qa_packages"].items():
              print(f"{package}={version}")
          '
          )
          if (( ${#qa_packages[@]} == 0 )); then
            echo "The PDF toolchain lock contains no host QA packages." >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            "${qa_packages[@]}"

      - name: Bootstrap and verify locked PDF toolchain
        run: |
          python3 scripts/bootstrap_pdf_toolchain.py \
            --lock pdf/toolchain.lock.json \
            --root .cache/pdf-toolchain

      - name: Validate canonical PDF and temporary Fira fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          make check-pdf 2>&1 | tee dist/check-pdf.log

      - name: Record build toolchain
        run: |
          python3 scripts/write_pdf_toolchain_record.py \
            --manifest pdf/guide_manifest.json \
            --lock pdf/toolchain.lock.json \
            --toolchain-root .cache/pdf-toolchain \
            --report dist/verapdf-report.xml \
            --check-log dist/check-pdf.log \
            --output dist/build-toolchain.txt \
            --require-github-context

      - name: Resolve manifest-derived artifact metadata
        id: pdf_output
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_pdf.py --print-workflow-metadata \
            >> "${GITHUB_OUTPUT}"

      - name: Upload validated PDF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # The semantic font fixture exists only in a temporary directory.
          # Upload exactly the manifest-selected PDF and its two records.
          name: ${{ steps.pdf_output.outputs.artifact_label }}-${{ github.sha }}
          path: |
            ${{ steps.pdf_output.outputs.path }}
            dist/build-toolchain.txt
            dist/verapdf-report.xml
          if-no-files-found: error
          retention-days: 14
