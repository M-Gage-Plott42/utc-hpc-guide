name: PDF Guide

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test toolchain-record failure paths
        run: python3 -m unittest tests.test_write_pdf_toolchain_record

      - name: Install exact host PDF QA packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t qa_packages < <(
            python3 -c '
          import json
          from pathlib import Path

          package_versions = {}
          for path in (
              "pdf/toolchain.lock.json",
              "pdf/font_proofs.lock.json",
          ):
              lock = json.loads(Path(path).read_text(encoding="utf-8"))
              for package, version in lock[
                  "ubuntu_24_04_qa_packages"
              ].items():
                  previous = package_versions.get(package)
                  if previous is not None and previous != version:
                      raise SystemExit(
                          f"conflicting package pin for {package}: "
                          f"{previous} != {version}"
                      )
                  package_versions[package] = version
          for package, version in sorted(package_versions.items()):
              print(f"{package}={version}")
          '
          )
          if (( ${#qa_packages[@]} == 0 )); then
            echo "The PDF toolchain lock contains no host QA packages." >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            "${qa_packages[@]}"

      - name: Bootstrap and verify locked PDF toolchain
        run: |
          python3 scripts/bootstrap_pdf_toolchain.py \
            --lock pdf/toolchain.lock.json \
            --root .cache/pdf-toolchain

      - name: Build twice and validate PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          make check-pdf 2>&1 | tee dist/check-pdf.log

      - name: Build twice and validate review-only typeface proofs
        shell: bash
        run: |
          set -euo pipefail
          make check-font-proofs 2>&1 | tee dist/font-proofs-check.log

      - name: Record build toolchain
        run: |
          python3 scripts/write_pdf_toolchain_record.py \
            --manifest pdf/guide_manifest.json \
            --lock pdf/toolchain.lock.json \
            --toolchain-root .cache/pdf-toolchain \
            --report dist/verapdf-report.xml \
            --check-log dist/check-pdf.log \
            --output dist/build-toolchain.txt \
            --require-github-context

      - name: Resolve manifest-derived artifact metadata
        id: pdf_output
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_pdf.py --print-workflow-metadata \
            >> "${GITHUB_OUTPUT}"

      - name: Upload validated PDF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pdf_output.outputs.artifact_label }}-${{ github.sha }}
          path: |
            ${{ steps.pdf_output.outputs.path }}
            dist/build-toolchain.txt
            dist/verapdf-report.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload validated review-only typeface proof bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: utc-hpc-guide-v1.2.2-typeface-proofs-${{ github.sha }}
          path: |
            dist/UTC_HPC_Guide_v1.2.2-font-proof-dejavu-large.pdf
            dist/UTC_HPC_Guide_v1.2.2-font-proof-cascadia-mono.pdf
            dist/UTC_HPC_Guide_v1.2.2-font-proof-fira-code.pdf
            dist/font-proofs/
            dist/font-proofs-check.log
          if-no-files-found: error
          retention-days: 14
