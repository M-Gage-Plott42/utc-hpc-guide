name: External Link Monitor

# External availability is intentionally monitored away from pull requests.
on:
  schedule:
    - cron: "37 9 * * 1"
  workflow_dispatch:

concurrency:
  group: external-links-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test external-link monitor
        run: python3 -m unittest tests.test_check_external_links

      - name: Check external HTTP(S) links
        run: >-
          python3 scripts/check_external_links.py
          --policy scripts/external_link_policy.json
          --timeout 15
          --retries 2
          --workers 4
