name: Shell Lint

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run shellcheck on sbatch examples
        run: |
          mapfile -t shell_files < <(git ls-files 'examples/*.sbatch')
          if [[ "${#shell_files[@]}" -eq 0 ]]; then
            echo "No sbatch scripts found."
            exit 0
          fi
          shellcheck -s bash "${shell_files[@]}"
